<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taskly – To-Do List</title>
    <meta name="description" content="Taskly – a simple, offline-first to-do list with reminders." />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <!-- ===== Header ===== -->
    <header class="app-header">
      <div class="header-inner">
        <div class="header-top">
          <div class="brand">
            <span class="brand-icon" aria-hidden="true">✅</span>
            <h1 class="brand-name">Taskly</h1>
          </div>
          <button class="btn btn-add-header" id="open-modal-btn" aria-haspopup="dialog">
            + Add Task
          </button>
        </div>
        <p class="brand-tagline">Stay organised, stay ahead.</p>
        <!-- Progress bar -->
        <div class="header-progress" aria-label="Completion progress">
          <div class="progress-track">
            <div class="progress-fill" id="progress-fill" style="width:0%"></div>
          </div>
          <span class="progress-label" id="progress-label">0% complete</span>
        </div>
      </div>
    </header>

    <!-- ===== Main ===== -->
    <main class="app-main">

      <!-- Stats -->
      <section class="stats-section" aria-label="Task statistics">
        <div class="stat-card stat-total">
          <span class="stat-number" id="stat-total">0</span>
          <span class="stat-label">Total</span>
        </div>
        <div class="stat-card stat-pending">
          <span class="stat-number" id="stat-pending">0</span>
          <span class="stat-label">Pending</span>
        </div>
        <div class="stat-card stat-completed">
          <span class="stat-number" id="stat-completed">0</span>
          <span class="stat-label">Done</span>
        </div>
        <div class="stat-card stat-overdue">
          <span class="stat-number" id="stat-overdue">0</span>
          <span class="stat-label">Overdue</span>
        </div>
      </section>

      <!-- Controls: Search + Filter -->
      <section class="controls-section" aria-label="Task controls">
        <div class="search-wrap">
          <label for="search-input" class="sr-only">Search tasks</label>
          <span class="search-icon" aria-hidden="true">🔍</span>
          <input
            type="search"
            id="search-input"
            class="search-input"
            placeholder="Search tasks…"
            autocomplete="off"
          />
          <button class="search-clear" id="search-clear" aria-label="Clear search" hidden>✕</button>
        </div>

        <div class="filter-wrap" role="group" aria-label="Filter tasks">
          <button class="filter-btn active" data-filter="all">All <span class="filter-count" id="fc-all"></span></button>
          <button class="filter-btn" data-filter="pending">Pending <span class="filter-count" id="fc-pending"></span></button>
          <button class="filter-btn" data-filter="completed">Done <span class="filter-count" id="fc-completed"></span></button>
        </div>
      </section>

      <!-- Task List -->
      <section class="tasks-section" aria-label="Task list">
        <ul class="task-list" id="task-list" aria-live="polite" aria-label="Tasks"></ul>
        <div class="empty-state" id="empty-state" hidden>
          <span class="empty-icon" aria-hidden="true">📋</span>
          <p class="empty-title">No tasks here yet!</p>
          <p class="empty-sub">Hit <strong>+ Add Task</strong> to get started.</p>
        </div>
      </section>

    </main>

    <!-- ===== Modal: Add / Edit Task ===== -->
    <div
      class="modal-overlay"
      id="modal-overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
      hidden
    >
      <div class="modal">
        <div class="modal-header">
          <h2 class="modal-title" id="modal-title">Add Task</h2>
          <button class="modal-close" id="modal-close" aria-label="Close dialog">✕</button>
        </div>

        <form class="task-form" id="task-form" novalidate>
          <input type="hidden" id="task-id" />

          <div class="form-group">
            <label for="task-name" class="form-label">
              Task Name <span class="required" aria-hidden="true">*</span>
            </label>
            <input
              type="text"
              id="task-name"
              class="form-control"
              placeholder="e.g. Buy groceries"
              maxlength="200"
              required
            />
            <span class="field-error" id="name-error" role="alert"></span>
          </div>

          <div class="form-group">
            <label for="task-desc" class="form-label">Description <span class="optional">(optional)</span></label>
            <textarea
              id="task-desc"
              class="form-control"
              rows="2"
              placeholder="Add more details…"
              maxlength="500"
            ></textarea>
          </div>

          <!-- Priority -->
          <div class="form-group">
            <label for="task-priority" class="form-label">Priority <span class="optional">(optional)</span></label>
            <select id="task-priority" class="form-control">
              <option value="none">— None —</option>
              <option value="low">🟢 Low</option>
              <option value="medium">🟡 Medium</option>
              <option value="high">🔴 High</option>
            </select>
          </div>

          <!-- Due Date + Time -->
          <div class="form-row">
            <div class="form-group form-group--half">
              <label for="task-due" class="form-label">Due Date <span class="optional">(optional)</span></label>
              <input type="date" id="task-due" class="form-control" />
            </div>
            <div class="form-group form-group--half">
              <label for="task-time" class="form-label">Due Time <span class="optional">(optional)</span></label>
              <input type="time" id="task-time" class="form-control" />
            </div>
          </div>

          <!-- Reminder -->
          <div class="form-group" id="reminder-group">
            <label class="form-label">Reminder <span class="optional">(optional)</span></label>
            <div class="reminder-row">
              <label class="toggle-label">
                <input type="checkbox" id="task-reminder" class="toggle-input" />
                <span class="toggle-track"><span class="toggle-thumb"></span></span>
                <span class="toggle-text" id="reminder-toggle-text">Off</span>
              </label>
              <div class="reminder-offset" id="reminder-offset-wrap" hidden>
                <select id="reminder-offset" class="form-control form-control--sm">
                  <option value="0">At the due time</option>
                  <option value="5">5 min before</option>
                  <option value="10">10 min before</option>
                  <option value="15" selected>15 min before</option>
                  <option value="30">30 min before</option>
                  <option value="60">1 hour before</option>
                  <option value="1440">1 day before</option>
                </select>
              </div>
            </div>
            <span class="field-hint" id="reminder-hint"></span>
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn-cancel" id="cancel-btn">Cancel</button>
            <button type="submit" class="btn btn-save" id="save-btn">Add Task</button>
          </div>
        </form>
      </div>
    </div>

    <!-- ===== Confirm Delete Modal ===== -->
    <div
      class="modal-overlay"
      id="confirm-overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="confirm-title"
      hidden
    >
      <div class="modal modal-sm">
        <div class="modal-header">
          <h2 class="modal-title" id="confirm-title">Delete Task</h2>
        </div>
        <p class="confirm-msg">Are you sure you want to delete this task? This cannot be undone.</p>
        <div class="form-actions">
          <button class="btn btn-cancel" id="confirm-cancel">Keep It</button>
          <button class="btn btn-delete-confirm" id="confirm-delete">Yes, Delete</button>
        </div>
      </div>
    </div>

    <!-- Toast container -->
    <div class="toast-container" id="toast-container" aria-live="assertive" aria-atomic="true"></div>

    <script src="script.js"></script>
  </body>
</html>
